services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    gpus: all  # RTX 4070 Ti via nvidia runtime — GPU face restoration + 4x upscale (torch)
    env_file: .env
    environment:
      - VIDPIPE_STORAGE__DATABASE_URL=${VIDPIPE_STORAGE__DATABASE_URL}
      - VIDPIPE_STORAGE__TMP_DIR=/app/tmp
      - VIDPIPE_STORAGE__STORAGE_BACKEND=s3
      - VIDPIPE_STORAGE__S3_ENDPOINT=http://supabase-kong:8000/storage/v1
      - VIDPIPE_STORAGE__S3_BUCKET=vidpipe-master
      - VIDPIPE_STORAGE__S3_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./tmp:/app/tmp
      # Persist InsightFace models (inswapper_128.onnx for face-swap + buffalo_l)
      # across rebuilds. Drop inswapper_128.onnx into ./models/insightface/.
      - ./models/insightface:/root/.insightface/models
      # CodeFormer + RealESRGAN weights for GPU face restoration / upscaling.
      - ./models/restore:/models/restore:ro
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./.gcp-credentials.json}:/app/credentials.json:ro
    ports:
      - "${VIDPIPE_PORT:-8100}:8000"
    networks:
      - default
      - supabase_default
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    ports:
      - "${VIDPIPE_FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  supabase_default:
    external: true
