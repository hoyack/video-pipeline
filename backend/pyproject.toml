[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidpipe"
version = "0.1.0"
description = "AI-powered video pipeline for multi-scene video generation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Video Pipeline Team"}
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.12.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "Pillow>=10.0",
    "httpx>=0.27.0",
    "mcp>=1.27,<2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "google-genai>=1.0.0",
    "numpy>=1.26.0",
    "ollama>=0.4.0",
    "tenacity>=8.0",
    "python-multipart>=0.0.6",
    "elevenlabs>=1.0",
    "replicate>=1.0.0",
    "opencv-python-headless>=4.8.0",
    "ultralytics>=8.3.0",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.18.0",
    # GPU face restoration (CodeFormer) + super-resolution (RealESRGAN) loaders.
    # spandrel runs these PyTorch models without the legacy basicsr/facexlib deps.
    "spandrel>=0.4.0",
    "spandrel-extra-arches>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vidpipe*"]
