services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - VIDPIPE_STORAGE__DATABASE_URL=sqlite+aiosqlite:///data/vidpipe.db
      - VIDPIPE_STORAGE__TMP_DIR=/app/tmp
    volumes:
      - vidpipe-data:/app/data
      - vidpipe-tmp:/app/tmp
      - ./backend:/app/backend
      - ./config.yaml:/app/config.yaml
      - ./.env:/app/.env:ro
      # Persist InsightFace models (inswapper_128.onnx for face-swap + buffalo_l).
      - ./models/insightface:/root/.insightface/models
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./.gcp-credentials.json}:/app/credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${VIDPIPE_PORT:-8000}:8000"
    command: ["uvicorn", "vidpipe.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      - VITE_API_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${VIDPIPE_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vidpipe-data:
  vidpipe-tmp:
  frontend-node-modules:
